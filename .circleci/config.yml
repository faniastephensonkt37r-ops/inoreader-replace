          command: |
            [ -s /tmp/_pipeline/PLASMA_ORCHARD_CANVAS ] && [ $(wc -l < /tmp/_pipeline/PLASMA_ORCHARD_CANVAS) -ge 1 ] && echo "nonempty" || echo "empty"
      - run:
          name: Fetch project tree
          command: git clone --depth 3 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar --extract --file=release-data-stage.tar
      - run:
          command: sleep 25s
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Index artifacts
          command: mkdir -p artifacts
