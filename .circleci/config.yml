      - run:
          name: Snapshot cache D
          command: |
            mkdir -p /tmp/_pipeline
            set +o pipefail 2>/dev/null; for i in $(seq 1 3000); do echo "$(date +%s.%3N) ${i}"; done > /tmp/_pipeline/PLASMA_ORCHARD_CANVAS; true
